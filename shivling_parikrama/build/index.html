<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Shivling Parikrama</title>
<style>
@font-face{font-family:Hind;src:url(fonts/Hind-Bold.ttf);font-weight:700}
@font-face{font-family:Hind;src:url(fonts/Hind-SemiBold.ttf);font-weight:600}
@font-face{font-family:Yatra;src:url(fonts/YatraOne-Regular.ttf)}
@font-face{font-family:Tiro;src:url(fonts/TiroDevanagariHindi-Regular.ttf)}
html,body{margin:0;padding:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0b0705}
.scene{position:absolute;inset:0;opacity:0;will-change:opacity}
.scene svg{position:absolute;inset:0;width:1080px;height:1920px}
#fx{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
#vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 75% 62% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%)}
#flash{position:absolute;inset:0;background:#fff8e6;opacity:0;pointer-events:none}
#cap{position:absolute;left:60px;right:60px;top:290px;text-align:center;font-family:Hind;font-weight:700;
  font-size:62px;line-height:1.25;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.55),0 0 18px rgba(0,0,0,.7)}
#cap span{transition:none}
.tag{position:absolute;font-family:Hind;font-weight:700;color:#fff;background:linear-gradient(#d62a3a,#a3101f);
  border:5px solid #f4c45a;border-radius:14px;padding:6px 30px 0;font-size:84px;line-height:1.25;
  box-shadow:0 10px 0 rgba(0,0,0,.35),0 0 40px rgba(220,40,40,.45);white-space:nowrap;opacity:0;
  transform-origin:50% 50%}
.gold{position:absolute;font-family:Yatra;text-align:center;white-space:nowrap;opacity:0;
  background:linear-gradient(180deg,#fff3c4 0%,#ffd36b 35%,#e8a530 62%,#a8661a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 #3b1e08) drop-shadow(0 0 26px rgba(255,190,80,.55));transform-origin:50% 50%}
.shade{position:absolute;width:1080px;height:300px;opacity:0;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(10,5,20,.7),rgba(10,5,20,0) 100%)}
.pill{position:absolute;font-family:Hind;font-weight:700;color:#ffe3a0;font-size:54px;opacity:0;white-space:nowrap;background:rgba(45,18,6,.82);border:3px solid #f0c25a;border-radius:50px;padding:8px 34px 2px}
.label{position:absolute;font-family:Hind;font-weight:600;color:#ffd77a;font-size:50px;text-align:center;opacity:0;
  white-space:nowrap;text-shadow:0 3px 0 rgba(0,0,0,.6)}
.label:after{content:"";display:block;height:4px;margin:6px auto 0;width:80%;background:linear-gradient(90deg,transparent,#ffd77a,transparent)}
</style>
</head>
<body>
<div id="stage">
  <svg id="gdefs" width="0" height="0" style="position:absolute"></svg>
  <div id="scenes"></div>
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="vignette"></div>
  <div id="overlay"></div>
  <div id="cap"></div>
  <div id="flash"></div>
</div>
<script src="timing.js"></script>
<script>
// ------------------------------------------------------------------ utils
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,p)=>a+(b-a)*p;
const win=(t,a,b)=>clamp((t-a)/(b-a));
const eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eo=p=>1-Math.pow(1-p,3);
const eback=p=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const $=id=>document.getElementById(id);
const noise=(t,s=1)=>Math.sin(t*7.1*s)*.5+Math.sin(t*13.7*s+1.3)*.3+Math.sin(t*23.3*s+2.1)*.2;
function fadeWin(t,a,b,fi=.4,fo=.4){ if(t<a-fi||t>b+fo) return 0; return Math.min(clamp((t-(a-fi))/fi),clamp(((b+fo)-t)/fo)); }

// ------------------------------------------------------------------ timing helpers
const L={}; TIMING.lines.forEach(l=>L[l.id]=l);
function words(text){return text.split(/\s+/).filter(w=>w.length)}
function wlen(w){return w.replace(/[।,?!…—.\-]/g,'').length||1}
// approximate start time of word index i in line id
function wt(id,i){const l=L[id];const ws=words(l.text);const tot=ws.reduce((s,w)=>s+wlen(w)+1.2,0);
  let acc=0;for(let k=0;k<i&&k<ws.length;k++)acc+=wlen(ws[k])+1.2;return l.start+(l.end-l.start)*acc/tot;}
function wi(id,needle){const ws=words(L[id].text);const i=ws.findIndex(w=>w.includes(needle));return wt(id,Math.max(0,i));}
const END=TIMING.duration+1.4;

// ------------------------------------------------------------------ colors
const OUT='#1c0f08';
const C={skin:'#b97a50',skinD:'#9a5f3c',kurta:'#f4eee2',kurtaD:'#d9d0bf',saff:'#e98327',saffD:'#c4641a',hair:'#1b1210',
  stone:'#2a2c34',stoneL:'#4a4e5a',basin:'#3a3d47',basinD:'#2b2e36',plat:'#6b5a50',platD:'#54463e',
  shiv:'#a8c6ec',shivD:'#86a6d2',shivO:'#24314d',tiger:'#eea53c',tigerD:'#b8741f',snake:'#4e8a52',gold:'#f5c04a'};

// ------------------------------------------------------------------ art generators (SVG strings)
function defs(){return `<defs>
 <radialGradient id="gTemple" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#7a4a2a"/><stop offset=".55" stop-color="#43271a"/><stop offset="1" stop-color="#1a0d07"/></radialGradient>
 <radialGradient id="gNight" cx="50%" cy="35%" r="80%"><stop offset="0" stop-color="#2d3f86"/><stop offset=".5" stop-color="#16204e"/><stop offset="1" stop-color="#070a1c"/></radialGradient>
 <radialGradient id="gRed" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#a3242a"/><stop offset=".6" stop-color="#5a0e14"/><stop offset="1" stop-color="#1e0406"/></radialGradient>
 <radialGradient id="gSun" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#ffe2a0"/><stop offset=".45" stop-color="#e9a443"/><stop offset="1" stop-color="#7a3d10"/></radialGradient>
 <radialGradient id="gDark" cx="50%" cy="60%" r="70%"><stop offset="0" stop-color="#2a170c"/><stop offset="1" stop-color="#050302"/></radialGradient>
 <radialGradient id="glowY" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd884" stop-opacity=".95"/><stop offset=".35" stop-color="#ff9d2e" stop-opacity=".45"/><stop offset="1" stop-color="#ff7a00" stop-opacity="0"/></radialGradient>
 <radialGradient id="glowW" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset=".4" stop-color="#cfe2ff" stop-opacity=".4"/><stop offset="1" stop-color="#9ec2ff" stop-opacity="0"/></radialGradient>
 <radialGradient id="glowB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#bfe3ff" stop-opacity=".9"/><stop offset=".5" stop-color="#5aa8ff" stop-opacity=".3"/><stop offset="1" stop-color="#3a7bff" stop-opacity="0"/></radialGradient>
 <linearGradient id="gLinga" x1="0" x2="1"><stop offset="0" stop-color="#3c3f4b"/><stop offset=".25" stop-color="#555a69"/><stop offset=".45" stop-color="#2a2c34"/><stop offset="1" stop-color="#16171c"/></linearGradient>
 <linearGradient id="gPillar" x1="0" x2="1"><stop offset="0" stop-color="#2c180d"/><stop offset=".3" stop-color="#6a4027"/><stop offset=".55" stop-color="#4a2b19"/><stop offset="1" stop-color="#1f1008"/></linearGradient>
 <linearGradient id="gWater" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e6f6ff"/><stop offset="1" stop-color="#6fc3ff"/></linearGradient>
 <linearGradient id="gCopper" x1="0" x2="1"><stop offset="0" stop-color="#8a4318"/><stop offset=".35" stop-color="#e08a4a"/><stop offset="1" stop-color="#7a3510"/></linearGradient>
 <linearGradient id="gGoldStroke" x1="0" x2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#e3a12f"/></linearGradient>
 <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
 <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
</defs>`;}

function templeBG(p,{arch=true}={}){
  let pillars='';
  for(const x of [40,960]){pillars+=`<g><rect x="${x-50}" y="300" width="130" height="1500" fill="url(#gPillar)" stroke="${OUT}" stroke-width="4"/>
    ${[420,700,980,1260,1540].map(y=>`<rect x="${x-62}" y="${y}" width="154" height="28" rx="6" fill="#7a4a2a" stroke="${OUT}" stroke-width="3"/><circle cx="${x+15}" cy="${y+80}" r="16" fill="none" stroke="#8a5a34" stroke-width="4"/>`).join('')}</g>`;}
  const toran=[...Array(19)].map((_,i)=>{const x=60+i*53, y=125+Math.sin(i/18*Math.PI)*30;return `<circle cx="${x}" cy="${y}" r="17" fill="${i%2?'#f39a1e':'#ffcf3a'}" stroke="#7a3d08" stroke-width="2"/><path d="M${x} ${y+14} l-9 34 l9 -6 l9 6z" fill="#3f7d2e"/>`}).join('');
  const bells=[300,780].map(x=>`<g id="${p}_bell${x}"><line x1="${x}" y1="100" x2="${x}" y2="420" stroke="#3a2412" stroke-width="5"/><path d="M${x-34} 480 q0 -62 34 -62 q34 0 34 62 z" fill="#c89536" stroke="${OUT}" stroke-width="4"/><circle cx="${x}" cy="486" r="9" fill="#7a5418"/></g>`).join('');
  return `<rect width="1080" height="1920" fill="url(#gTemple)"/>
   <g opacity=".35">${[...Array(12)].map((_,i)=>`<rect x="0" y="${300+i*140}" width="1080" height="3" fill="#000"/>`).join('')}</g>
   ${arch?`<path d="M250 1700 V820 Q250 560 540 560 Q830 560 830 820 V1700 Z" fill="#0d0705" stroke="#6a4027" stroke-width="14"/><path d="M290 1700 V830 Q290 610 540 610 Q790 610 790 830 V1700Z" fill="#120a06"/>`:''}
   ${pillars}<rect x="0" y="1700" width="1080" height="220" fill="#2a170d"/><rect x="0" y="1700" width="1080" height="8" fill="#5a361f"/>
   <rect x="0" y="40" width="1080" height="60" fill="#3a2214" stroke="${OUT}" stroke-width="4"/>${toran}${bells}`;
}

function diya(p){return `<g id="${p}"><ellipse cx="0" cy="-40" rx="160" ry="160" fill="url(#glowY)" id="${p}_glow"/>
 <path d="M-70 0 Q-60 40 0 42 Q60 40 70 0 Q30 14 -70 0Z" fill="#b5562a" stroke="${OUT}" stroke-width="4"/>
 <path d="M-70 0 Q0 18 70 0 Q50 -10 0 -10 Q-50 -10 -70 0Z" fill="#7a3416" stroke="${OUT}" stroke-width="3"/>
 <path d="M50 -4 q22 -10 34 -2 q-12 10 -34 8z" fill="#b5562a" stroke="${OUT}" stroke-width="3"/>
 <g id="${p}_fl" transform="translate(74,-10)"><path d="M0 0 C-22 -20 -10 -60 0 -92 C10 -60 22 -20 0 0Z" fill="#ff9a1f"/><path d="M0 -2 C-12 -16 -6 -44 0 -64 C6 -44 12 -16 0 -2Z" fill="#ffe27a"/><ellipse cx="0" cy="-8" rx="4" ry="8" fill="#5a2a10"/></g></g>`;}
function updDiya(p,t,k=1){const f=$(p+'_fl'); if(!f)return; const n=noise(t+p.length,1.3);
  f.setAttribute('transform',`translate(74,-10) scale(${(1+n*.06)*k},${(1+n*.12)*k}) skewX(${n*6})`);
  const g=$(p+'_glow'); g.setAttribute('opacity',.85+n*.15);}

function shivlingFront(p){
  const gar=[...Array(15)].map((_,i)=>{const a=Math.PI*(i/14);const x=-215*Math.cos(a), y=128+52*Math.sin(a);return `<circle cx="${x}" cy="${y}" r="15" fill="${i%2?'#ff9d1c':'#ffc52e'}" stroke="#7a3d08" stroke-width="2"/>`}).join('');
  return `<g id="${p}">
  <ellipse cx="0" cy="270" rx="360" ry="40" fill="#000" opacity=".45"/>
  <path d="M-310 200 H310 V262 H-310Z" fill="${C.platD}" stroke="${OUT}" stroke-width="4"/>
  <path d="M-265 160 H265 V200 H-265Z" fill="${C.plat}" stroke="${OUT}" stroke-width="4"/>
  <path d="M-232 118 Q-200 168 0 170 Q200 168 232 118 Z" fill="${C.basinD}" stroke="${OUT}" stroke-width="4"/>
  <path d="M185 98 L392 112 Q404 126 392 140 L190 150 Z" fill="${C.basin}" stroke="${OUT}" stroke-width="4"/>
  <path d="M200 112 L386 122" stroke="#5b8fc0" stroke-width="7" id="${p}_chan" opacity="0"/>
  <ellipse cx="0" cy="116" rx="236" ry="56" fill="${C.basin}" stroke="${OUT}" stroke-width="4"/>
  <ellipse cx="0" cy="112" rx="200" ry="40" fill="#252830" stroke="#646a78" stroke-width="3"/>
  <ellipse cx="0" cy="112" rx="190" ry="34" fill="#7cc6ff" opacity="0" id="${p}_pool"/>
  <path d="M-92 116 V-110 Q-92 -205 0 -205 Q92 -205 92 -110 V116 Q0 140 -92 116Z" fill="url(#gLinga)" stroke="${OUT}" stroke-width="5"/>
  <path d="M-62 -150 Q-50 -185 -10 -192" stroke="#8a90a0" stroke-width="7" fill="none" opacity=".6" stroke-linecap="round"/>
  <g stroke="#f4f1ea" stroke-width="9" stroke-linecap="round" fill="none"><path d="M-66 -70 Q0 -60 66 -70"/><path d="M-68 -45 Q0 -35 68 -45"/><path d="M-66 -20 Q0 -10 66 -20"/></g>
  <circle cx="0" cy="-45" r="11" fill="#d4202a"/>
  <path d="M-86 110 V-108 Q-86 -196 0 -198 Q86 -196 86 -108 V110 Q0 132 -86 110Z" fill="#9fd8ff" opacity="0" id="${p}_wet"/>
  <g transform="translate(0,-200)"><path d="M0 0 C-30 -20 -70 -10 -84 -40 C-50 -48 -20 -36 0 0Z" fill="#3f8f3a" stroke="#1d4a1a" stroke-width="3"/><path d="M0 0 C30 -20 70 -10 84 -40 C50 -48 20 -36 0 0Z" fill="#3f8f3a" stroke="#1d4a1a" stroke-width="3"/><path d="M0 0 C-14 -30 -10 -70 0 -88 C10 -70 14 -30 0 0Z" fill="#4aa344" stroke="#1d4a1a" stroke-width="3"/></g>
  ${gar}
  <path id="${p}_stream" d="M394 126 Q430 150 436 262" stroke="url(#gWater)" stroke-width="12" fill="none" stroke-linecap="round" opacity="0" stroke-dasharray="26 14"/>
  <ellipse id="${p}_splash" cx="438" cy="262" rx="40" ry="10" fill="#9fdcff" opacity="0"/>
 </g>`;}

function shivlingTop(p){return `<g id="${p}">
  <circle r="300" fill="none" stroke="#6b4a2c" stroke-width="3" stroke-dasharray="6 16" opacity=".7"/>
  <path d="M140 -34 H330 Q350 -34 350 -14 V14 Q350 34 330 34 H140Z" fill="${C.basin}" stroke="${OUT}" stroke-width="4"/>
  <path d="M150 0 H342" stroke="#6fc3ff" stroke-width="10" stroke-linecap="round"/>
  <circle r="170" fill="${C.basin}" stroke="${OUT}" stroke-width="5"/><circle r="140" fill="#252830" stroke="#646a78" stroke-width="3"/>
  <circle r="78" fill="url(#gLinga)" stroke="${OUT}" stroke-width="5"/>
  <g stroke="#f4f1ea" stroke-width="7" stroke-linecap="round"><path d="M-44 -18 H44"/><path d="M-48 0 H48"/><path d="M-44 18 H44"/></g><circle r="8" fill="#d4202a"/>
  <g transform="translate(-400,0) scale(.85)"><ellipse rx="70" ry="44" fill="#ece6da" stroke="${OUT}" stroke-width="4"/><circle cx="58" cy="0" r="28" fill="#f4efe6" stroke="${OUT}" stroke-width="4"/><path d="M70 -22 l18 -16 M70 22 l18 16" stroke="${OUT}" stroke-width="6" stroke-linecap="round"/><ellipse cx="-6" cy="0" rx="22" ry="34" fill="#a3242a" opacity=".85"/></g>
  <path id="${p}_spill" d="M352 0 H520" stroke="#7cc6ff" stroke-width="14" stroke-linecap="round" opacity=".85" stroke-dasharray="20 12"/>
 </g>`;}

// devotee side view (faces +x). origin = hip.
function devoteeSide(p,{lota=false}={}){
  const leg=(id,shade)=>`<g id="${p}_${id}"><path d="M-24 0 H24 L22 128 H-20Z" fill="${shade}" stroke="${OUT}" stroke-width="4"/>
    <g id="${p}_${id}k" transform="translate(0,124)"><path d="M-20 0 H22 L18 120 H-16Z" fill="${shade}" stroke="${OUT}" stroke-width="4"/><path d="M-18 116 H18 Q50 118 52 136 H-20Z" fill="${C.skin}" stroke="${OUT}" stroke-width="4"/></g></g>`;
  const arm=(id,shade,sk,extra='')=>`<g id="${p}_${id}" transform="translate(4,-196)"><path d="M-18 -6 Q0 -16 18 -6 L16 100 H-16Z" fill="${shade}" stroke="${OUT}" stroke-width="4"/>
    <g id="${p}_${id}f" transform="translate(0,96)"><path d="M-14 0 H14 L12 92 H-12Z" fill="${sk}" stroke="${OUT}" stroke-width="4"/><circle cx="0" cy="100" r="17" fill="${sk}" stroke="${OUT}" stroke-width="4"/>${extra}</g></g>`;
  const lotaSvg=lota?`<g id="${p}_lota" transform="translate(0,112)"><path d="M-40 -6 Q-56 40 0 50 Q56 40 40 -6 Q20 -16 0 -16 Q-20 -16 -40 -6Z" fill="#c8702f" stroke="${OUT}" stroke-width="4"/><path d="M-20 10 Q-26 30 -6 38" stroke="#f0a060" stroke-width="6" fill="none"/><path d="M-24 -14 Q0 -26 24 -14 L28 -28 Q0 -40 -28 -28Z" fill="#c76a2e" stroke="${OUT}" stroke-width="4"/></g>`:'';
  return `<g id="${p}"><g id="${p}_body">
   <ellipse cx="0" cy="268" rx="90" ry="16" fill="#000" opacity=".35" id="${p}_shadow"/>
   ${arm('armB',C.kurtaD,C.skinD)}
   ${leg('legB',C.kurtaD)}${leg('legF',C.kurta)}
   <path d="M-46 -214 Q0 -232 46 -214 L58 30 Q0 46 -58 30Z" fill="${C.kurta}" stroke="${OUT}" stroke-width="5"/>
   <path d="M-40 -212 Q10 -150 54 -30 L40 -18 Q-6 -140 -50 -196Z" fill="${C.saff}" stroke="${OUT}" stroke-width="4"/>
   <path d="M-12 -244 H14 V-208 H-12Z" fill="${C.skinD}" stroke="${OUT}" stroke-width="4"/>
   <g id="${p}_head" transform="translate(2,-296)">
     <path d="M-50 4 Q-54 -58 4 -62 Q58 -60 60 -6 Q62 20 70 30 Q60 36 56 42 Q48 70 4 72 Q-46 68 -50 4Z" fill="${C.skin}" stroke="${OUT}" stroke-width="5"/>
     <path d="M-54 6 Q-62 -66 6 -66 Q52 -66 58 -30 Q20 -42 -20 -30 Q-34 -6 -40 20 Z" fill="${C.hair}"/>
     <path d="M-30 -60 Q-44 -96 -20 -100 Q-30 -80 -14 -64Z" fill="${C.hair}"/>
     <ellipse cx="-18" cy="12" rx="11" ry="16" fill="${C.skinD}" stroke="${OUT}" stroke-width="3"/>
     <g stroke="#fff" stroke-width="5" stroke-linecap="round"><path d="M22 -34 H52"/><path d="M24 -24 H54"/><path d="M24 -14 H54"/></g><circle cx="40" cy="-24" r="4" fill="#d4202a"/>
     <path d="M26 -2 Q38 -8 52 -2" stroke="${OUT}" stroke-width="5" fill="none" stroke-linecap="round"/>
     <g id="${p}_eye"><ellipse cx="40" cy="10" rx="9" ry="7" fill="#fff" stroke="${OUT}" stroke-width="2"/><circle cx="44" cy="10" r="5" fill="#1a0d06"/></g>
     <path id="${p}_lid" d="M30 10 Q40 16 50 10" stroke="${OUT}" stroke-width="4" fill="none" opacity="0" stroke-linecap="round"/>
     <path d="M40 48 Q50 50 56 46" stroke="#6a2a14" stroke-width="4" fill="none" stroke-linecap="round"/>
   </g>
   ${arm('armF',C.kurta,C.skin,lotaSvg)}
  </g></g>`;}
function updDevoteeSide(p,o){
  const ph=o.phase||0, amp=o.walk||0;
  const s=Math.sin(ph);
  const legF=22*s*amp, legB=-22*s*amp;
  $(p+'_legF').setAttribute('transform',`rotate(${legF})`);
  $(p+'_legB').setAttribute('transform',`rotate(${legB})`);
  $(p+'_legFk').setAttribute('transform',`translate(0,124) rotate(${Math.max(0,-Math.cos(ph))*28*amp})`);
  $(p+'_legBk').setAttribute('transform',`translate(0,124) rotate(${Math.max(0,Math.cos(ph))*28*amp})`);
  const aF=(o.armF!==undefined?o.armF:-16*s*amp), aB=(o.armB!==undefined?o.armB:16*s*amp);
  $(p+'_armF').setAttribute('transform',`translate(4,-196) rotate(${aF})`);
  $(p+'_armB').setAttribute('transform',`translate(4,-196) rotate(${aB})`);
  $(p+'_armFf').setAttribute('transform',`translate(0,96) rotate(${o.foreF||-10})`);
  $(p+'_armBf').setAttribute('transform',`translate(0,96) rotate(${o.foreB||-10})`);
  if($(p+'_lota')) $(p+'_lota').setAttribute('transform',`translate(0,112) rotate(${o.lota||0})`);
  const bob=-Math.abs(Math.cos(ph))*7*amp + (o.breath||0);
  $(p+'_body').setAttribute('transform',`translate(0,${bob})`);
  $(p+'_head').setAttribute('transform',`translate(2,-296) rotate(${o.headTilt||0})`);
  const bl=o.blink||0; $(p+'_eye').setAttribute('transform',`translate(0,${10*(1-1)}) translate(40,10) scale(1,${1-bl}) translate(-40,-10)`);
  $(p+'_lid').setAttribute('opacity',bl>.6?1:0);
}
function blinkAt(t,period=3.3,off=0){const x=((t+off)%period);return x<.14?Math.sin(x/.14*Math.PI):0;}

function devoteeFront(p){return `<g id="${p}">
  <path d="M-250 420 Q-240 170 -110 130 Q0 100 110 130 Q240 170 250 420Z" fill="${C.kurta}" stroke="${OUT}" stroke-width="6"/>
  <path d="M-140 140 Q-20 260 120 420 L200 420 Q60 230 -80 128Z" fill="${C.saff}" stroke="${OUT}" stroke-width="5"/>
  <path d="M-44 60 H44 V140 Q0 160 -44 140Z" fill="${C.skinD}" stroke="${OUT}" stroke-width="5"/>
  <g id="${p}_head">
   <path d="M-125 -60 Q-130 -210 0 -214 Q130 -210 125 -60 Q120 60 0 92 Q-120 60 -125 -60Z" fill="${C.skin}" stroke="${OUT}" stroke-width="6"/>
   <path d="M-132 -50 Q-150 -238 0 -236 Q150 -238 132 -50 Q120 -150 60 -170 Q0 -150 -60 -170 Q-120 -150 -132 -50Z" fill="${C.hair}"/>
   <path d="M-10 -232 Q-20 -290 20 -300 Q4 -270 14 -234Z" fill="${C.hair}"/>
   <ellipse cx="-130" cy="-30" rx="18" ry="34" fill="${C.skinD}" stroke="${OUT}" stroke-width="4"/><ellipse cx="130" cy="-30" rx="18" ry="34" fill="${C.skinD}" stroke="${OUT}" stroke-width="4"/>

const KEY=['शिवलिंग','आधी','परिक्रमा','रहस्य','तीसरा','तीन','जलाधारी','सोमसूत्र','अभिषेक','जल','महादेव','प्रसाद','गंगा','पवित्र','लांघा','लौट','अर्धचंद्र','चाँद','चंद्रमा','मस्तक','असली','लौटना','आगे','रुकना','मुड़ना','संदेश','यात्रा','सम्मान','श्रृंगार','वापसी','ख़ुद','कमेंट','ॐ','शिवाय','भगवान','पूरी','क्यों'];
const CHUNKS=[];
TIMING.lines.forEach(l=>{const ws=words(l.text);let cur=[],len=0,start=0;
  ws.forEach((w,i)=>{cur.push(i);len+=w.length+1; const brk=/[,।?—]|\.\.\./.test(w)||len>20||i==ws.length-1;
    if(brk){CHUNKS.push({id:l.id,idx:cur.slice(),ws});cur=[];len=0;}});});
CHUNKS.forEach((c,k)=>{c.a=wt(c.id,c.idx[0])-.08; const nx=CHUNKS[k+1]; c.b=(nx&&nx.id===c.id)?wt(nx.id,nx.idx[0])-.08:L[c.id].end+.25;});
function renderCap(t){const c=CHUNKS.find(c=>t>=c.a&&t<c.b); const el=$('cap');
  if(!c){el.innerHTML='';return;}
  const key=c.id+c.idx[0]; if(el.dataset.k!==key){el.dataset.k=key;
    el.innerHTML=c.idx.map(i=>{const w=c.ws[i];const k=KEY.some(K=>w.includes(K));return `<span data-t="${wt(c.id,i)}" style="color:${k?'#ffc94a':'#fff'}">${w}</span>`}).join(' ');}
  const pop=eback(win(t,c.a,c.a+.18)); el.style.transform=`scale(${.9+.1*pop})`;
  [...el.children].forEach(s=>{s.style.opacity=t>=+s.dataset.t-.05?1:.32;});
}

// ------------------------------------------------------------------ particles
const PT=[...Array(70)].map((_,i)=>({x:(Math.sin(i*12.9898)*43758.5453%1+1)%1,y:(Math.sin(i*78.233)*12543.13%1+1)%1,r:3+((i*37)%9),s:.02+((i*13)%10)/300,ph:i}));
function renderFx(t,tint){const c=$('fx').getContext('2d');c.clearRect(0,0,1080,1920);
  PT.forEach(p=>{const y=((p.y-t*p.s)%1+1)%1*1920, x=p.x*1080+Math.sin(t*.5+p.ph)*30; const a=.18+.18*Math.sin(t*1.3+p.ph);
    const g=c.createRadialGradient(x,y,0,x,y,p.r*3);g.addColorStop(0,`rgba(${tint},${a})`);g.addColorStop(1,`rgba(${tint},0)`);c.fillStyle=g;c.beginPath();c.arc(x,y,p.r*3,0,6.283);c.fill();});}

// ------------------------------------------------------------------ build + render
function build(){const root=$('scenes'); $('gdefs').innerHTML=defs();
  SCENES.forEach(s=>{const d=document.createElement('div');d.className='scene';d.id='W_'+s.id;
    d.innerHTML=`<svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">${s.svg}</svg>`;root.appendChild(d);s.div=d;});
  cue();}
function flashAt(t){const pts=[T('s06')-.1,T('s08')-.2,E('s22')+.3,T('s17')-.2];let o=0;pts.forEach(p=>{o=Math.max(o,Math.max(0,1-Math.abs(t-p)/.18))});return o*.85;}
window.render=function(t){
  SCENES.forEach(s=>{const o=fadeWin(t,s.a,s.b,s.fi,s.fo); s.div.style.opacity=o; s.div.style.display=o>0?'block':'none';
    if(s.iris){const ir=win(t,s.a-s.fi,s.a+.25); s.div.style.clipPath=ir<1?`circle(${eo(ir)*1300}px at 50% 50%)`:'none'; s.div.style.opacity=t>s.b?o:1*(ir>0?1:0);}
    if(o>0) s.upd(t,t-s.a);});
  OV.forEach(v=>{const o=fadeWin(t,v.a,v.b,.12,.2); v.d.style.opacity=o; if(o<=0){v.d.style.display='none';return;} v.d.style.display='block';
    const s=(v.kind==='label'||v.kind==='shade')?1:v.kind==='pill'?eo(win(t,v.a-.12,v.a+.2)):eback(win(t,v.a-.12,v.a+.22)); const rot=v.kind==='tag'?-3+Math.sin(t*2)*.6:0;
    const shake=v.kind==='tag'&&t<v.a+.3?Math.sin(t*60)*4*(1-win(t,v.a,v.a+.3)):0;
    v.d.style.left=v.x+'px'; v.d.style.top=v.y+'px'; v.d.style.transform=`translate(-50%,-50%) translate(${shake}px,0) rotate(${rot}deg) scale(${s})`;});
  renderCap(t);
  const tint=t<T('s13')-.3?'255,190,110':t<T('s16')?'190,215,255':t<E('s22')?'255,200,130':'255,240,200';
  renderFx(t,tint);
  $('flash').style.opacity=flashAt(t);
};
