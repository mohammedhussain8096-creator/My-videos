<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Karna Kavach Daan</title>
<style>
@font-face{font-family:Hind;src:url(fonts/Hind-Bold.ttf);font-weight:700}
@font-face{font-family:Hind;src:url(fonts/Hind-SemiBold.ttf);font-weight:600}
@font-face{font-family:Yatra;src:url(fonts/YatraOne-Regular.ttf)}
html,body{margin:0;padding:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#05040a}
.scene{position:absolute;inset:0;opacity:0}
.scene svg{position:absolute;inset:0;width:1080px;height:1920px}
#fx{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 62% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.5) 100%)}
#flash{position:absolute;inset:0;background:#fff8e6;opacity:0;pointer-events:none}
#cap{position:absolute;left:40px;right:40px;top:1390px;text-align:center;font-family:Hind;font-weight:700;transform-origin:50% 50%;
  font-size:64px;line-height:1.25;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.55),0 0 18px rgba(0,0,0,.7)}
.capbox{display:inline-block;max-width:960px;background:rgba(12,6,3,.58);border:2px solid rgba(255,214,120,.35);border-radius:24px;padding:12px 30px 4px}
.tag{position:absolute;font-family:Hind;font-weight:700;color:#fff;background:linear-gradient(#d62a3a,#a3101f);border:5px solid #f4c45a;border-radius:14px;
  padding:6px 30px 0;font-size:84px;line-height:1.25;box-shadow:0 10px 0 rgba(0,0,0,.35),0 0 40px rgba(220,40,40,.45);white-space:nowrap;opacity:0}
.gold{position:absolute;font-family:Yatra;text-align:center;white-space:nowrap;opacity:0;line-height:1.15;
  background:linear-gradient(180deg,#fff3c4 0%,#ffd36b 35%,#e8a530 62%,#a8661a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 #3b1e08) drop-shadow(0 0 26px rgba(255,190,80,.55))}
.label{position:absolute;font-family:Hind;font-weight:600;color:#ffd77a;font-size:50px;text-align:center;opacity:0;white-space:nowrap;text-shadow:0 3px 0 rgba(0,0,0,.7)}
.label:after{content:"";display:block;height:4px;margin:6px auto 0;width:80%;background:linear-gradient(90deg,transparent,#ffd77a,transparent)}
.pill{position:absolute;font-family:Hind;font-weight:700;color:#ffe3a0;font-size:54px;opacity:0;white-space:nowrap;background:rgba(45,18,6,.82);border:3px solid #f0c25a;border-radius:50px;padding:8px 34px 2px}
.shade{position:absolute;width:1080px;height:300px;opacity:0;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(10,5,20,.7),rgba(10,5,20,0) 100%)}
</style>
</head>
<body>
<div id="stage">
  <svg id="gdefs" width="0" height="0" style="position:absolute"></svg>
  <div id="scenes"></div>
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="vignette"></div>
  <div id="overlay"></div>
  <div id="cap"></div>
  <div id="flash"></div>
</div>
<script src="timing.js"></script>
<script>
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,p)=>a+(b-a)*p;
const win=(t,a,b)=>clamp((t-a)/(b-a));
const eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eo=p=>1-Math.pow(1-p,3);
const ei=p=>p*p*p;
const eback=p=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const $=id=>document.getElementById(id);
const A=(id,k,v)=>{const e=$(id); if(e) e.setAttribute(k,v);};
const noise=(t,s=1)=>Math.sin(t*7.1*s)*.5+Math.sin(t*13.7*s+1.3)*.3+Math.sin(t*23.3*s+2.1)*.2;
function fadeWin(t,a,b,fi=.4,fo=.4){ if(t<a-fi||t>b+fo) return 0; return Math.min(clamp((t-(a-fi))/fi),clamp(((b+fo)-t)/fo)); }
const L={}; TIMING.lines.forEach(l=>L[l.id]=l);
function words(text){return text.split(/\s+/).filter(w=>w.length)}
function wlen(w){return w.replace(/[।,?!…—.\-]/g,'').length||1}
function wt(id,i){const l=L[id];const ws=words(l.text);const tot=ws.reduce((s,w)=>s+wlen(w)+1.2,0);
  let acc=0;for(let k=0;k<i&&k<ws.length;k++)acc+=wlen(ws[k])+1.2;return l.start+(l.end-l.start)*acc/tot;}
function wi(id,needle,nth=0){const ws=words(L[id].text);let c=-1;for(let i=0;i<ws.length;i++){if(ws[i].includes(needle)){c++;if(c===nth)return wt(id,i);}}return L[id].start;}
const T=id=>L[id].start, E=id=>L[id].end;
const END=TIMING.duration+1.2;
const OUT='#140a06';
function blinkAt(t,period=3.3,off=0){const x=((t+off)%period);return x<.14?Math.sin(x/.14*Math.PI):0;}

// ============================================================ DEFS
function defs(){return `<defs>
 <radialGradient id="gCosmos" cx="50%" cy="38%" r="80%"><stop offset="0" stop-color="#3a2c7a"/><stop offset=".45" stop-color="#1a1645"/><stop offset="1" stop-color="#05040f"/></radialGradient>
 <radialGradient id="gCourt" cx="50%" cy="40%" r="80%"><stop offset="0" stop-color="#7a2a1a"/><stop offset=".55" stop-color="#3a1009"/><stop offset="1" stop-color="#120403"/></radialGradient>
 <linearGradient id="gNightSky" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#090c2a"/><stop offset=".6" stop-color="#22265e"/><stop offset="1" stop-color="#5a3a5a"/></linearGradient>
 <radialGradient id="gSun" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#ffe2a0"/><stop offset=".45" stop-color="#e9a443"/><stop offset="1" stop-color="#7a3d10"/></radialGradient>
 <radialGradient id="gDark" cx="50%" cy="55%" r="70%"><stop offset="0" stop-color="#2a1a40"/><stop offset="1" stop-color="#040208"/></radialGradient>
 <radialGradient id="glowY" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe7a8" stop-opacity=".95"/><stop offset=".35" stop-color="#ffae3e" stop-opacity=".45"/><stop offset="1" stop-color="#ff7a00" stop-opacity="0"/></radialGradient>
 <radialGradient id="glowB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#b9d0ff" stop-opacity=".9"/><stop offset=".45" stop-color="#5b7cff" stop-opacity=".35"/><stop offset="1" stop-color="#3a4bff" stop-opacity="0"/></radialGradient>
 <radialGradient id="glowR" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffb0a0" stop-opacity=".95"/><stop offset=".4" stop-color="#ff3a2a" stop-opacity=".4"/><stop offset="1" stop-color="#ff0000" stop-opacity="0"/></radialGradient>
 <radialGradient id="glowW" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffffff" stop-opacity="1"/><stop offset=".4" stop-color="#fff2c8" stop-opacity=".5"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
 <linearGradient id="gGold" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset=".45" stop-color="#f2c14e"/><stop offset="1" stop-color="#a86f14"/></linearGradient>
 <linearGradient id="gGoldV" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff2b0"/><stop offset=".5" stop-color="#e9b23e"/><stop offset="1" stop-color="#9a6210"/></linearGradient>
 <linearGradient id="gShani" x1="0" x2="1"><stop offset="0" stop-color="#4c5ca8"/><stop offset=".45" stop-color="#2c3a78"/><stop offset="1" stop-color="#161e48"/></linearGradient>
 <linearGradient id="gRav" x1="0" x2="1"><stop offset="0" stop-color="#d79868"/><stop offset=".45" stop-color="#b0703f"/><stop offset="1" stop-color="#7a4424"/></linearGradient>
 <linearGradient id="gHan" x1="0" x2="1"><stop offset="0" stop-color="#ff9a48"/><stop offset=".45" stop-color="#e06a22"/><stop offset="1" stop-color="#a2420e"/></linearGradient>
 <linearGradient id="gBlueCloth" x1="0" x2="1"><stop offset="0" stop-color="#3a58c0"/><stop offset=".5" stop-color="#22388a"/><stop offset="1" stop-color="#121f52"/></linearGradient>
 <linearGradient id="gRedCloth" x1="0" x2="1"><stop offset="0" stop-color="#e2443e"/><stop offset=".5" stop-color="#a81b22"/><stop offset="1" stop-color="#5e0d12"/></linearGradient>
 <linearGradient id="gCape" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#6a1018"/><stop offset="1" stop-color="#2a050a"/></linearGradient>
 <linearGradient id="gHair" x1="0" x2="1"><stop offset="0" stop-color="#2c2a48"/><stop offset="1" stop-color="#0c0b18"/></linearGradient>
 <linearGradient id="gPillar" x1="0" x2="1"><stop offset="0" stop-color="#5a3a10"/><stop offset=".3" stop-color="#d9a640"/><stop offset=".55" stop-color="#9a6a1c"/><stop offset="1" stop-color="#3a2408"/></linearGradient>
 <linearGradient id="gWall" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#4a120c"/><stop offset="1" stop-color="#1e0705"/></linearGradient>
 <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
</defs>`;}

// ============================================================ SMALL PARTS
const gem=(x,y,r,c='#2c55e0')=>`<g transform="translate(${x},${y})"><circle r="${r+4}" fill="url(#gGold)" stroke="${OUT}" stroke-width="2"/><circle r="${r}" fill="${c}"/><circle cx="${-r*.35}" cy="${-r*.35}" r="${r*.35}" fill="#fff" opacity=".75"/></g>`;
const pearls=(pts,r=5)=>pts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff8e6" stroke="#b08a50" stroke-width="1.5"/>`).join('');
function arcPts(cx,cy,rx,ry,a0,a1,n){return [...Array(n)].map((_,i)=>{const a=a0+(a1-a0)*i/(n-1);return [cx+rx*Math.cos(a),cy+ry*Math.sin(a)]});}
function stars(n=110,seed=3,h=1600){let s='';for(let i=0;i<n;i++){const x=(Math.sin(i*91.7+seed)*0.5+0.5)*1080,y=(Math.sin(i*47.3+seed*2)*0.5+0.5)*h;s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${1.4+((i*7)%3)}" fill="#fff" opacity="${(.3+((i*13)%7)/10).toFixed(2)}"/>`;}return s;}
function rays(p,color='#ffd98a',n=18,op=.18){return `<g id="${p}" opacity="${op}">${[...Array(n)].map((_,i)=>{const a=i/n*2*Math.PI;return `<path d="M0 0 L${(Math.cos(a-.06)*1700).toFixed(0)} ${(Math.sin(a-.06)*1700).toFixed(0)} L${(Math.cos(a+.06)*1700).toFixed(0)} ${(Math.sin(a+.06)*1700).toFixed(0)}Z" fill="${color}"/>`}).join('')}</g>`;}
function saturnPlanet(p,r=120){return `<g id="${p}"><circle r="${r*1.8}" fill="url(#glowB)" opacity=".5"/>
  <path d="M${-r*2} 0 A${r*2} ${r*.5} 0 0 1 ${r*2} 0" fill="none" stroke="#c9b27a" stroke-width="${r*.14}" opacity=".9" transform="rotate(-18)"/>
  <circle r="${r}" fill="url(#gGold)"/><circle r="${r}" fill="#7a5a30" opacity=".35"/>
  ${[-.5,-.15,.2,.5].map(k=>`<path d="M${-r*.95} ${r*k} Q0 ${r*k+r*.12} ${r*.95} ${r*k}" stroke="#8a6630" stroke-width="${r*.08}" fill="none" opacity=".6"/>`).join('')}
  <path d="M${-r*2} 0 A${r*2} ${r*.5} 0 0 0 ${r*2} 0" fill="none" stroke="#e8d6a0" stroke-width="${r*.14}" opacity=".95" transform="rotate(-18)"/></g>`;}

// ============================================================ EXTRA DEFS (Karna)
function defs2(){return `<defs>
 <linearGradient id="gKarna" x1="0" x2="1"><stop offset="0" stop-color="#f6c992"/><stop offset=".45" stop-color="#dc9c62"/><stop offset="1" stop-color="#a8683a"/></linearGradient>
 <linearGradient id="gSurya" x1="0" x2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset=".5" stop-color="#f29a2e"/><stop offset="1" stop-color="#b8601a"/></linearGradient>
 <linearGradient id="gIndra" x1="0" x2="1"><stop offset="0" stop-color="#ffe2c4"/><stop offset=".5" stop-color="#ecbf96"/><stop offset="1" stop-color="#b98a62"/></linearGradient>
 <linearGradient id="gBrah" x1="0" x2="1"><stop offset="0" stop-color="#d9a070"/><stop offset=".5" stop-color="#b47a4a"/><stop offset="1" stop-color="#7e5030"/></linearGradient>
 <linearGradient id="gMaroon" x1="0" x2="1"><stop offset="0" stop-color="#b03048"/><stop offset=".5" stop-color="#7a1428"/><stop offset="1" stop-color="#420816"/></linearGradient>
 <linearGradient id="gSaffron" x1="0" x2="1"><stop offset="0" stop-color="#ffb04a"/><stop offset=".5" stop-color="#e8801e"/><stop offset="1" stop-color="#a8500e"/></linearGradient>
 <linearGradient id="gWhiteCloth" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#e8e2d4"/><stop offset="1" stop-color="#b8b0a0"/></linearGradient>
 <linearGradient id="gDawn" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2a2a6a"/><stop offset=".35" stop-color="#b8507a"/><stop offset=".62" stop-color="#ffa04a"/><stop offset="1" stop-color="#ffd890"/></linearGradient>
 <linearGradient id="gDusk" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3a1a4a"/><stop offset=".5" stop-color="#d8603a"/><stop offset="1" stop-color="#ffc070"/></linearGradient>
 <linearGradient id="gWar" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5a2a1a"/><stop offset=".6" stop-color="#c8743a"/><stop offset="1" stop-color="#e8a860"/></linearGradient>
 <linearGradient id="gRiver" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffb870"/><stop offset=".3" stop-color="#5a6aa8"/><stop offset="1" stop-color="#1a2050"/></linearGradient>
 <linearGradient id="gWood" x1="0" x2="1"><stop offset="0" stop-color="#8a5a2a"/><stop offset="1" stop-color="#4a2a10"/></linearGradient>
 <radialGradient id="gSunDisc" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fffbe6"/><stop offset=".55" stop-color="#ffd860"/><stop offset="1" stop-color="#ff9a20"/></radialGradient>
</defs>`;}

const sunEmblem=(r=40)=>`<g><circle r="${r*1.5}" fill="url(#glowY)" opacity=".6"/>${[...Array(12)].map((_,i)=>{const a=i/12*2*Math.PI;return `<path d="M${(Math.cos(a-.12)*r).toFixed(1)} ${(Math.sin(a-.12)*r).toFixed(1)} L${(Math.cos(a)*r*1.55).toFixed(1)} ${(Math.sin(a)*r*1.55).toFixed(1)} L${(Math.cos(a+.12)*r).toFixed(1)} ${(Math.sin(a+.12)*r).toFixed(1)}Z" fill="#fff0a8" stroke="#a86f14" stroke-width="2"/>`}).join('')}<circle r="${r}" fill="url(#gSunDisc)" stroke="#a86f14" stroke-width="3"/><circle r="${r*.55}" fill="none" stroke="#c88a20" stroke-width="2"/></g>`;
function sword(){return `<g><path d="M-8 0 H8 V-40 H-8Z" fill="#5a2a10" stroke="${OUT}" stroke-width="3"/><path d="M-34 -40 H34 V-52 H-34Z" fill="url(#gGold)" stroke="${OUT}" stroke-width="3"/>
  <path d="M-12 -52 L12 -52 L8 -330 L0 -360 L-8 -330Z" fill="#dfe6f0" stroke="${OUT}" stroke-width="3"/><path d="M0 -60 V-340" stroke="#9aa6b8" stroke-width="3"/></g>`;}
function lota(){return `<g><path d="M-40 -6 Q-56 40 0 50 Q56 40 40 -6 Q20 -16 0 -16 Q-20 -16 -40 -6Z" fill="url(#gGold)" stroke="${OUT}" stroke-width="4"/><path d="M-24 -14 Q0 -26 24 -14 L28 -28 Q0 -40 -28 -28Z" fill="#e9b23e" stroke="${OUT}" stroke-width="4"/></g>`;}

// ============================================================ KARNA FRONT (origin feet)
function karnaFront(p){
  const arm=(id,side,extra='')=>`<g id="${p}_${id}" transform="translate(${side*155},-715)">
     <path d="M-38 0 Q-46 72 -32 154 L32 154 Q46 72 38 0 Q0 -24 -38 0Z" fill="url(#gKarna)" stroke="${OUT}" stroke-width="5"/>
     <path d="M-40 54 H40 V76 H-40Z" fill="url(#gGold)" stroke="${OUT}" stroke-width="3"/>${gem(0,65,7,'#d0182a')}
     <g id="${p}_${id}f" transform="translate(0,150)"><path d="M-30 0 L-24 126 L24 126 L30 0Z" fill="url(#gKarna)" stroke="${OUT}" stroke-width="5"/>
       <path d="M-27 96 H27 V120 H-27Z" fill="url(#gGold)" stroke="${OUT}" stroke-width="3"/>
       <path d="M-26 122 Q-34 182 -6 194 Q4 198 14 192 Q34 178 26 122Z" fill="url(#gKarna)" stroke="${OUT}" stroke-width="5"/>${extra}</g></g>`;
  const kund=(s)=>`<g id="${p}_k${s>0?'R':'L'}" transform="translate(${s*94},40)"><circle r="46" fill="url(#glowY)" class="${p}_kg"/>${[...Array(10)].map((_,i)=>{const a=i/10*2*Math.PI;return `<path d="M${Math.cos(a)*18} ${Math.sin(a)*18} L${Math.cos(a)*30} ${Math.sin(a)*30}" stroke="#fff0a8" stroke-width="4"/>`}).join('')}<circle r="20" fill="url(#gSunDisc)" stroke="#a86f14" stroke-width="3"/><path d="M0 20 L-6 40 L0 50 L6 40Z" fill="url(#gGold)" stroke="${OUT}" stroke-width="2"/></g>`;
  return `<g id="${p}">
  <ellipse cx="0" cy="0" rx="230" ry="30" fill="#000" opacity=".45"/>
  <g transform="translate(110,-640) rotate(18)"><rect x="-34" y="-260" width="68" height="300" rx="14" fill="url(#gWood)" stroke="${OUT}" stroke-width="5"/>${[-20,0,20].map(x=>`<path d="M${x} -260 V-330" stroke="#5a3a1a" stroke-width="5"/><path d="M${x-10} -330 L${x} -352 L${x+10} -330Z" fill="#c8c8d0" stroke="${OUT}" stroke-width="2"/>`).join('')}<path d="M-34 -200 H34 M-34 -40 H34" stroke="url(#gGold)" stroke-width="8"/></g>
  <path d="M-100 -950 Q-170 -800 -160 -600 Q-150 -540 -110 -520 L110 -520 Q150 -540 160 -600 Q170 -800 100 -950Z" fill="url(#gHair)" stroke="${OUT}" stroke-width="4"/>
  <path d="M-120 -140 L-68 -140 L-72 -44 L-116 -44Z M120 -140 L68 -140 L72 -44 L116 -44Z" fill="url(#gKarna)" stroke="${OUT}" stroke-width="5"/>
  <path d="M-120 -60 H-68 M120 -60 H68" stroke="url(#gGold)" stroke-width="12"/>
  <ellipse cx="-98" cy="-22" rx="50" ry="22" fill="url(#gKarna)" stroke="${OUT}" stroke-width="5"/><ellipse cx="98" cy="-22" rx="50" ry="22" fill="url(#gKarna)" stroke="${OUT}" stroke-width="5"/>
  <path d="M-158 -478 L158 -478 L184 -122 Q120 -92 40 -116 L0 -210 L-40 -116 Q-120 -92 -184 -122Z" fill="url(#gMaroon)" stroke="${OUT}" stroke-width="5"/>
  <path d="M-184 -122 Q-120 -92 -40 -116 L0 -210 L40 -116 Q120 -92 184 -122" fill="none" stroke="url(#gGold)" stroke-width="12"/>
  <path d="M-32 -468 L32 -468 L24 -160 L-24 -160Z" fill="#ffc83a" stroke="${OUT}" stroke-width="3"/>
  ${[...Array(8)].map((_,i)=>`<path d="M${-130+i*37} -300 l8 12 l-8 12 l-8 -12z" fill="#f2c14e"/>`).join('')}
  <g id="${p}_torso">
   <path d="M-48 -805 L48 -805 L54 -722 L-54 -722Z" fill="#c4844e" stroke="${OUT}" stroke-width="5"/>
   <path d="M-150 -728 Q-172 -600 -132 -470 L132 -470 Q172 -600 150 -728 Q0 -770 -150 -728Z" fill="url(#gKarna)" stroke="${OUT}" stroke-width="6"/>
   <path d="M-100 -650 Q-52 -616 -10 -642 M100 -650 Q52 -616 10 -642" stroke="#8a5028" stroke-width="5" fill="none"/>
   <path d="M-40 -580 Q-20 -572 0 -580 Q20 -572 40 -580 M-36 -530 Q0 -520 36 -530" stroke="#8a5028" stroke-width="4" fill="none"/>
   <path d="M-112 -726 Q0 -600 124 -478" stroke="#f2ede0" stroke-width="5" fill="none"/>
   <path id="${p}_scar" d="M-110 -690 Q0 -640 110 -560" stroke="#ffe08a" stroke-width="6" fill="none" opacity="0"/>
   <path d="M-165 -490 L165 -490 L160 -460 L-160 -460Z" fill="url(#gGold)" stroke="${OUT}" stroke-width="4"/>${gem(0,-475,11,'#d0182a')}
  </g>
  <g id="${p}_kav">
   <clipPath id="${p}_kclip"><path d="M-156 -735 Q0 -790 156 -735 Q170 -600 140 -500 Q0 -470 -140 -500 Q-170 -600 -156 -735Z"/></clipPath>
   <circle cx="0" cy="-620" r="300" fill="url(#glowY)" id="${p}_kavglow" opacity=".6"/>
   <path d="M-156 -735 Q0 -790 156 -735 Q170 -600 140 -500 Q0 -470 -140 -500 Q-170 -600 -156 -735Z" fill="url(#gGold)" stroke="${OUT}" stroke-width="6"/>
   <g clip-path="url(#${p}_kclip)">${[...Array(7)].map((_,r)=>[...Array(9)].map((_,c)=>`<path d="M${-170+c*42+(r%2)*21} ${-740+r*40} q21 30 42 0" fill="none" stroke="#a86f14" stroke-width="3"/>`).join('')).join('')}
    <path id="${p}_shine" d="M-300 -800 L-240 -800 L-360 -400 L-420 -400Z" fill="#fff" opacity=".55"/></g>
   <g transform="translate(0,-640)">${sunEmblem(42)}</g>
   ${[-1,1].map(s=>`<ellipse cx="${s*165}" cy="-735" rx="58" ry="36" fill="url(#gGoldV)" stroke="${OUT}" stroke-width="5"/>${gem(s*165,-740,8,'#d0182a')}`).join('')}
  </g>
  ${arm('armL',-1)}${arm('armR',1,`<g id="${p}_sword" opacity="0" transform="translate(0,170)">${sword()}</g>`)}
  <g id="${p}_head" transform="translate(0,-860)">
   <path d="M-84 -30 Q-88 -112 0 -120 Q88 -112 84 -30 Q80 52 42 86 Q0 110 -42 86 Q-80 52 -84 -30Z" fill="url(#gKarna)" stroke="${OUT}" stroke-width="6"/>

 ov('gold','कोई खाली हाथ नहीं',wi('k09','खाली')-.15,E('k09')+.25,540,330,104);
 ov('label','अर्घ्य',T('k10')+.3,wi('k10','ब्राह्मण')-.3,540,300,60);
 ov('tag','कवच और कुंडल',wi('k11','कवच')-.05,E('k11')+.25,540,330,84);
 ov('gold','इंद्र',wi('k12','इंद्र')-.1,E('k12')+.2,540,330,170);
 ov('tag','दान',wi('k13','हाथों')-.1,E('k13')+.25,540,330,110);
 ov('tag','आँखें झुक गईं',wi('k14','आँखें')-.05,E('k14')+.2,540,330,84);
 ov('gold','वासवी शक्ति',wi('k15','वासवी')-.1,E('k15')+.25,540,330,124);
 ov('tag','सुरक्षा खो दी',wi('k16','सुरक्षा')-.05,E('k16')+.25,540,330,84);
 ov('gold','दानवीर कर्ण',wi('k17','दानवीर')-.1,T('k18')-.3,540,330,140);
 ov('pill','कमेंट में लिखिए',T('k18')+.05,END,540,250,58);
 ov('gold','दानवीर कर्ण',wi('k18','दानवीर')-.1,END,540,420,140);
}

// ============================================================ CAPTIONS
const KEY=['कर्ण','सूर्यपुत्र','कवच','कुंडल','हरा','दान','क्यों','महाभारत','युद्ध','सूर्यदेव','सपने','इंद्र','ब्राह्मण','मना','खाली','हाथ','सूर्य','जल','मुस्कुराया','तलवार','अलग','आँखें','झुक','वासवी','शक्ति','सुरक्षा','इतिहास','दानवीर','कमेंट'];
const CHUNKS=[];
TIMING.lines.forEach(l=>{const ws=words(l.text);let cur=[],len=0;
  ws.forEach((w,i)=>{cur.push(i);len+=w.length+1; const brk=/[,।?—]|\.\.\./.test(w)||len>20||i==ws.length-1;
    if(brk){CHUNKS.push({id:l.id,idx:cur.slice(),ws});cur=[];len=0;}});});
CHUNKS.forEach((c,k)=>{c.a=wt(c.id,c.idx[0])-.08; const nx=CHUNKS[k+1]; c.b=(nx&&nx.id===c.id)?wt(nx.id,nx.idx[0])-.08:L[c.id].end+.25;});
function renderCap(t){const c=CHUNKS.find(c=>t>=c.a&&t<c.b); const el=$('cap');
  if(!c){el.innerHTML='';el.dataset.k='';return;}
  const key=c.id+c.idx[0]; if(el.dataset.k!==key){el.dataset.k=key;
    el.innerHTML='<div class="capbox">'+c.idx.map(i=>{const w=c.ws[i];const k=KEY.some(K=>w.includes(K));return `<span data-t="${wt(c.id,i)}" style="color:${k?'#ffc94a':'#fff'}">${w}</span>`}).join(' ')+'</div>';}
  const pop=eback(win(t,c.a,c.a+.18)); el.style.transform=`scale(${.9+.1*pop})`;
  [...el.querySelectorAll('span')].forEach(s=>{s.style.opacity=t>=+s.dataset.t-.05?1:.32;});
}
// ============================================================ PARTICLES
const PT=[...Array(70)].map((_,i)=>({x:(Math.sin(i*12.9898)*43758.5453%1+1)%1,y:(Math.sin(i*78.233)*12543.13%1+1)%1,r:3+((i*37)%9),s:.02+((i*13)%10)/300,ph:i}));
function renderFx(t,tint){const c=$('fx').getContext('2d');c.clearRect(0,0,1080,1920);
  PT.forEach(p=>{const y=((p.y-t*p.s)%1+1)%1*1920, x=p.x*1080+Math.sin(t*.5+p.ph)*30; const a=.16+.16*Math.sin(t*1.3+p.ph);
    const g=c.createRadialGradient(x,y,0,x,y,p.r*3);g.addColorStop(0,`rgba(${tint},${a})`);g.addColorStop(1,`rgba(${tint},0)`);c.fillStyle=g;c.beginPath();c.arc(x,y,p.r*3,0,6.283);c.fill();});}
// ============================================================ BUILD/RENDER
function build(){$('gdefs').innerHTML=defs()+defs2(); const root=$('scenes');
  SCENES.forEach(s=>{const d=document.createElement('div');d.className='scene';d.id='W_'+s.id;
    d.innerHTML=`<svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">${s.svg}</svg>`;root.appendChild(d);s.div=d;});
  cue();}
const FLASH=()=>[T('k06')-.2,wi('k13','अलग'),T('k14')-.25,wi('k17','दानवीर')-.1];
function flashAt(t){let o=0;FLASH().forEach(p=>{o=Math.max(o,Math.max(0,1-Math.abs(t-p)/.16))});return o*.8;}
window.render=function(t){
  SCENES.forEach(s=>{const o=fadeWin(t,s.a,s.b,s.fi,s.fo); s.div.style.opacity=o; s.div.style.display=o>0?'block':'none'; if(o>0) s.upd(t,t-s.a);});
  OV.forEach(v=>{const o=fadeWin(t,v.a,v.b,.12,.2); v.d.style.opacity=o; if(o<=0){v.d.style.display='none';return;} v.d.style.display='block';
    const s=(v.kind==='label'||v.kind==='shade')?1:v.kind==='pill'?eo(win(t,v.a-.12,v.a+.2)):eback(win(t,v.a-.12,v.a+.22)); const rot=v.kind==='tag'?-3+Math.sin(t*2)*.6:0;
    const shake=v.kind==='tag'&&t<v.a+.3?Math.sin(t*60)*4*(1-win(t,v.a,v.a+.3)):0;
    v.d.style.left=v.x+'px'; v.d.style.top=v.y+'px'; v.d.style.transform=`translate(-50%,-50%) translate(${shake}px,0) rotate(${rot}deg) scale(${s})`;});
  renderCap(t);
  const tint=(t>T('k06')-.2&&t<T('k08')-.2)||(t>T('k14')-.25&&t<T('k16')-.3)?'180,200,255':'255,215,150';
  renderFx(t,tint); $('flash').style.opacity=flashAt(t);
};
build();
window.CUES={ov:OV.map(v=>({a:v.a,kind:v.kind})),scenes:SCENES.map(s=>({id:s.id,a:s.a,b:s.b})),
 walks:[],water:[[T('k10')-.1,wi('k10','ब्राह्मण')-.2]],arrows:[0,1,2,3,4].map(i=>T('k04')+.1+i*.55+.33),
 slash:wi('k13','अलग')-.1,shimmer:[wi('k03','कवच'),wi('k03','कुंडल'),wi('k15','वासवी')],dream:wi('k07','सपने')-.5,
 drums:[T('k05'),wi('k12','इंद्र'),wi('k17','दानवीर')],end:END};
document.fonts.ready.then(()=>{window.READY=true; render(0);});
</script>
